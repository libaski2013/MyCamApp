name: Build GPU portrait worker
on:
  workflow_dispatch:
  push:
    paths:
      - gpu-worker/**
      - .github/workflows/gpu-worker.yml
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: gpu-worker
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/mycamapp-gpu:latest
